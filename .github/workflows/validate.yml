name: Validate bundle
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-pptx
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node skills/academic-figure-workflow/tests/test_native.mjs
      - run: python skills/academic-figure-workflow/tests/test_pptx_tools.py assets/examples/active-learning.pptx
      - run: python skills/academic-figure-workflow/scripts/audit_pptx.py assets/examples/active-learning.pptx --require-native --min-font-pt 9.5 --font Arial
